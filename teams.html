<!doctype html>
<html lang="en">
  <head>
    <!-- @include head -->
    <title>Teams · IntroTech Buildathon 2026</title>
    <link rel="stylesheet" href="/src/styles/pages/teams.css">
    <meta name="description" content="Explore the products, features, team leads, and demos from the IntroTech Buildathon 2026 teams.">
  </head>
  <body>
    <!-- @include header -->

    <main id="main">
      <header class="page-hero">
        <div class="backdrop-grid" aria-hidden="true"></div>
        <div class="glow-orb glow-orb--brand page-hero__orb" aria-hidden="true"></div>
        <div class="container">
          <span class="eyebrow-text" data-reveal><span class="live-dot" aria-hidden="true"></span>IntroTech Buildathon 2026</span>
          <h1 class="h1 text-chrome" data-reveal style="--delay:60ms">Meet the teams and their projects.</h1>
          <p class="lede" data-reveal style="--delay:120ms">Explore each product, the problem it addresses, its key features, and the tools behind it.</p>
        </div>
      </header>

      <section class="section teams-section" aria-label="All teams">
        <div class="container">
          <div class="toolbar">
            <p class="toolbar__count muted" data-team-count aria-live="polite"></p>
            <div class="segmented" role="group" aria-label="Sort teams" data-sort-control>
              <button type="button" data-sort="name" aria-pressed="true">Team name</button>
              <button type="button" data-sort="product" aria-pressed="false">Product name</button>
              <button type="button" data-sort="votes" aria-pressed="false">Votes here</button>
            </div>
          </div>
          <div class="team-grid" data-team-grid data-spotlight-group></div>
        </div>
      </section>
    </main>

    <!-- @include footer -->
    <script type="module" src="/src/pages/teams.ts"></script>
  </body>
</html>
